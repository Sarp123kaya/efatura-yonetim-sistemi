<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}E-Fatura Web Panel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('dashboard') }}">E-Fatura Panel</a>
        {% if session.get("user") %}
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('jobs') }}">Joblar</a>
                <a href="{{ url_for('reports') }}">Raporlar</a>
                <form method="post" action="{{ url_for('logout') }}" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token') }}">
                    <button type="submit" class="link-button">Çıkış</button>
                </form>
            </nav>
        {% endif %}
    </header>

    <main class="container">
        {% for warning in setup_warnings %}
            <div class="alert warning">{{ warning }}</div>
        {% endfor %}
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
