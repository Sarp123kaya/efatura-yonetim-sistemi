{% extends "base.html" %}
{% block title %}Giriş — E-Fatura Panel{% endblock %}
{% block content %}
<div class="auth-card">
    <div style="text-align:center;margin-bottom:24px;">
        <div style="width:52px;height:52px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px;">📊</div>
        <h1 style="font-size:20px;margin-bottom:4px;">E-Fatura Panel</h1>
        <p style="font-size:13px;color:var(--text-3);">Devam etmek için giriş yapın</p>
    </div>
    <form method="post" class="stack">
        <label>
            Kullanıcı adı
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>
            Parola
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" style="width:100%;justify-content:center;margin-top:4px;">Giriş Yap</button>
    </form>
    <p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:16px;">
        VPS kullanımında <code>WEB_ADMIN_USER</code>, <code>WEB_ADMIN_PASSWORD</code> ve <code>WEB_SECRET_KEY</code> değerlerini <code>.env</code> içinde ayarlayın.
    </p>
</div>
{% endblock %}
