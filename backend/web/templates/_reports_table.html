{% if reports %}
<table>
    <thead>
        <tr>
            <th>Dosya</th>
            <th>Boyut</th>
        </tr>
    </thead>
    <tbody>
    {% for report in reports %}
        <tr>
            <td><a href="{{ url_for('download', relative_path=report.relative_path) }}">{{ report.name }}</a></td>
            <td>{{ report.size_kb }} KB</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p class="muted">Henüz Excel raporu yok.</p>
{% endif %}
