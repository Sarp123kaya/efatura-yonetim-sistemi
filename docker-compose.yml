services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: invoices_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices_user -d invoices"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: postgresql://invoices_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/invoices
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
    volumes:
      - ./kayıtlar:/app/kayıtlar
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: gunicorn -b 0.0.0.0:8000 backend.web.app:app

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: postgresql://invoices_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/invoices
    volumes:
      - ./kayıtlar:/app/kayıtlar
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 scripts/run_web_worker.py

volumes:
  postgres_data:
